<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        h1{
            text-transform: capitalize;
            font-family:Arial, Helvetica, sans-serif;
            /* color: white; */
            /* background: linear-gradient(to right, darkblue, skyblue); */
        }
        div{
            height: 150px;
            /* border: 1px solid black; */
            margin-bottom: 20px;
        }
        .lg{
            background: linear-gradient(45deg, #ff8700 , #7524af);
        }
        .rg{
            background: radial-gradient(#256ecd , #75f6f1);
            width: 150px;
        }
        .cg{
            width: 200px;
            height: 200px;
            background: linear-gradient(130deg,#bb73e0, #ff8bbf);
        }
        .lg3{
            background: linear-gradient(to right,#ff6f91, #845ec2, #008f7a);
        }
    </style>
</head>
<body>
    <h1>Type of gradients</h1>
    <p>CSS me mainly 3 types ke gradients hote hai.</p>
    <ol>
        <li>Linear Gradient</li>
        <li>Radial Gradient</li>
        <li>Conic Gradient</li>
    </ol>

    <div class="lg">1. Linear Gradient</div>
    <div class="lg3">1. Linear Gradient</div>
    <div class="rg">2. Radial Gradient</div>
    <div class="cg">3. Conic Gradient</div>
</body>
</html>
