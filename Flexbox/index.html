<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Flexbox</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <h1>CSS Flexbox</h1>
    <p>Ye css ka modern layout system hai jiske use element ko row ya column me arrange karne ke liye hota hai.
        Phle layout banane ke liye float aur position use hoti thi jo difficult thi.
        Isliye Flexbox introduce kiya gaya.
    </p>

    <div class="container">
        <div class="box" id="box1">Box1</div>
        <div class="box" id="box2">Box2</div>
        <div class="box" id="box3">Box3</div>
    </div>
</body>
</html>
