<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Card Mini Project</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="sticky-header">
        <h1>My Profile</h1>
    </header>
    <section class="profile-card">
        <img src="image.jpeg" alt="Profile Image" class="profile-image">
        <h2 class="name">sohit kumar</h2>
        <p class="bio">Front-end Developer with 5+ Years of experience building user friendly tools. Also experienced in backend and AI Engineering.</p>

        <div class="stats">
            <div class="stat">
                <h3>Project</h3>
                <p>105</p>
            </div>
            <div class="stat">
                <h3>Clients</h3>
                <p>75+</p>
            </div>
            <div class="stat">
                <h3>Awards</h3>
                <p>10+</p>
            </div>
        </div>
    </section>
    <button class="contact-btn">Contact me</button>
</body>
</html>
